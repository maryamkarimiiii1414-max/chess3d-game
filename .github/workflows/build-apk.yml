name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          for z in *.zip; do unzip -q -o "$z"; done
          cp -r chess3d-apk/. .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm packages
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Add Tapsell, icons and manifest changes
        run: python3 scripts/patch_android.py

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        if: env.KEYSTORE_B64 != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" \
            --out chess3d-release.apk aligned.apk
          rm -f release.jks

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chess3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: chess3d-release-apk
          path: chess3d-release.apk
