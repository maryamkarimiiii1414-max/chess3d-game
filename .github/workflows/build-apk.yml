name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          set -e
          echo "== files in repo =="
          find . -maxdepth 3 -not -path './.git/*' | sort
          for round in 1 2 3; do
            found=0
            while IFS= read -r z; do
              echo "unzipping $z"
              unzip -q -o "$z" -d "$(dirname "$z")"
              rm -f "$z"
              found=1
            done < <(find . -name '*.zip' -not -path './.git/*' -not -path '*/node_modules/*')
            [ "$found" = 0 ] && break
          done
          CFG=$(find . -name capacitor.config.json -not -path './.git/*' -not -path '*/node_modules/*' -not -path './android/*' | head -1)
          if [ -z "$CFG" ]; then
            echo "ERROR: capacitor.config.json not found. Upload chess3d-apk-3.zip to the repo."
            exit 1
          fi
          SRC=$(dirname "$CFG")
          echo "project folder: $SRC"
          if [ "$SRC" != "." ]; then cp -r "$SRC"/. .; fi
          test -f www/index.html
          test -f scripts/patch_android.py
          test -f native/TapsellBridge.java
          echo "project OK"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm packages
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Add Tapsell, icons and manifest changes
        run: python3 scripts/patch_android.py

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        if: env.KEYSTORE_B64 != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" \
            --out chess3d-release.apk aligned.apk
          rm -f release.jks

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chess3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: chess3d-release-apk
          path: chess3d-release.apk
